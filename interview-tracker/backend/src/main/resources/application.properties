spring.application.name=interview-tracker

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interview_tracker?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:interview_tracker}
spring.datasource.password=${DB_PASSWORD:interview_tracker}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Error handling
server.error.include-message=always

# CORS Configuration
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForInterviewTrackerThatIsLongEnoughForHS256Algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server port
server.port=8080
